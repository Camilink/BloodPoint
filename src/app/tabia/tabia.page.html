<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Tabia - ChatBot Diagflow IA</ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tabia - ChatBot Diagflow IA</ion-title>
    </ion-toolbar>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </ion-header>

  <ion-grid class="ion-padding">
    <ion-row class="ion-justify-content-center">
      <ion-col size-md="8" size-sm="12" class="ion-text-center">
        <ion-list>
          <!-- Header con botón volver -->
          <ion-item lines="none">
            <ion-buttons slot="start">
              <ion-back-button defaultHref="/tabs/tabb"></ion-back-button>
            </ion-buttons>
            <ion-label>
              <h1 class="ion-text-center">Chat Automatizado</h1>
            </ion-label>
          </ion-item>
          <!-- Lista de QA -->
          <ion-list>
            <ion-item lines="none">
              <ion-thumbnail slot="start">
                <div class="custom-thumbnail">
                  <i class="fa-solid fa-droplet"></i>
                </div>
              </ion-thumbnail>
              <ion-label>
                <h2>¿Quién puede donar sangre?</h2>
              </ion-label>
            </ion-item>
          
            <ion-item lines="none">
              <ion-thumbnail slot="start">
                <div class="custom-thumbnail">
                  <i class="fa-solid fa-droplet"></i>
                </div>
              </ion-thumbnail>
              <ion-label>
                <h2>¿Cuánto debo esperar entre donaciones?</h2>
              </ion-label>
            </ion-item>
          
            <ion-item lines="none">
              <ion-thumbnail slot="start">
                <div class="custom-thumbnail">
                  <i class="fa-solid fa-droplet"></i>
                </div>
              </ion-thumbnail>
              <ion-label>
                <h2>¿Es seguro donar sangre?</h2>
              </ion-label>
            </ion-item>

            <ion-item lines="none">
              <ion-thumbnail slot="start">
                <div class="custom-thumbnail">
                  <i class="fa-solid fa-droplet"></i>
                </div>
              </ion-thumbnail>
              <ion-label>
                <h2>¿Qué debo hacer después de donar?</h2>
              </ion-label>
            </ion-item>
          </ion-list>
          <!-- Item ChqtBot Simulacion -->
          <ion-card class="chat-card">
            <ion-card-content>
              <div class="chat-message">
                <ion-avatar slot="start">
                  <i class="fas fa-robot" style="font-size: 40px; color: #4CAF50;"></i>
                </ion-avatar>
                <div class="message">
                  <ion-textarea>¡Hola! Soy tu asistente robot. ¿En qué puedo ayudarte hoy?</ion-textarea>
                </div>
              </div>
            </ion-card-content>
            <!-- Item Boton Enviar Mensaje -->
            <ion-button color="success">
              <i class="fa-solid fa-comments" style="margin-right: 8px;"></i>Enviar
            </ion-button>
          </ion-card>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>


</ion-content>
