<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Detallesh - Detalle de Historial</ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ovalo ovalotop"></div>
  <div class="ovalo ovalomid"></div>

  <!-- Header with back button -->
  <div class="header-section">
    <div class="back-button" [routerLink]="['/menu/historialdonacion']">
      <i class="fas fa-arrow-left"></i>
    </div>
    <h1>Detalle del historial</h1>
  </div>

  <!-- Details Card -->
  <div class="details-card">
    <!-- Basic Info Section -->
    <div class="info-section">
      <div class="info-item">
        <i class="fa-solid fa-map-location-dot"></i>
        <div class="info-text">
          <span class="label">Dirección:</span>
          <span class="value">Copiapo 234</span>
        </div>
      </div>

      <div class="info-item">
        <i class="fa-regular fa-clock"></i>
        <div class="info-text">
          <span class="label">Fecha:</span>
          <span class="value">Miercoles 2 de abril de 2025</span>
        </div>
      </div>

      <div class="info-item">
        <i class="fa-solid fa-droplet"></i>
        <div class="info-text">
          <span class="label">Tipo de sangre:</span>
          <span class="value">O+</span>
        </div>
      </div>
    </div>

    <!-- Additional Info Section -->
    <div class="additional-info">
      <div class="info-row">
        <span class="label">Tipo de donación:</span>
        <span class="value pill">Reposición</span>
      </div>

      <div class="info-row">
        <span class="label">Cantidad:</span>
        <span class="value pill">450 mL</span>
      </div>
    </div>
  </div>
</ion-content>
