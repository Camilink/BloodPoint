<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Registro</ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Registro</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <form #registroForm="ngForm" (ngSubmit)="registrarDonante(registroForm.value)">
      <ion-list>
        <!-- Item Name -->
        <ion-item>
          <ion-input 
            name="nombreCompleto"
            [(ngModel)]="formData.nombreCompleto"
            labelPlacement="stacked" 
            [clearInput]="true" 
            label="Nombre Completo" 
            placeholder="John Doe">
          </ion-input>
        </ion-item>

        <!-- Item Birth -->
        <ion-item>
          <ion-label position="stacked">Fecha de nacimiento</ion-label>
          <ion-input 
            name="fechaNacimiento"
            [(ngModel)]="formData.fechaNacimiento"
            type="date" 
            placeholder="Selecciona una fecha">
          </ion-input>
        </ion-item>

        <!-- Item Email -->
        <ion-item>
          <ion-input 
            name="correoElectronico"
            [(ngModel)]="formData.correoElectronico"
            labelPlacement="stacked" 
            [clearInput]="true" 
            label="Correo Electronico" 
            placeholder="BloodPoint@domain.com">
          </ion-input>
        </ion-item>

        <!-- Item Sexo Biologico y Teléfono -->
        <ion-item>
          <ion-grid [fixed]="true">
            <ion-row>
              <ion-col>
                <ion-item>
                  <ion-select 
                    name="sexoBiologico"
                    [(ngModel)]="formData.sexoBiologico"
                    label="Sexo Biologico">
                    <ion-select-option value="H">Hombre</ion-select-option>
                    <ion-select-option value="M">Mujer</ion-select-option>
                  </ion-select>
                </ion-item>
              </ion-col>
              <ion-col>
                <ion-input 
                  name="telefono"
                  [(ngModel)]="formData.telefono"
                  labelPlacement="stacked" 
                  [clearInput]="true" 
                  label="Numero de telefono" 
                  type="tel" 
                  placeholder="569-0000-0000">
                </ion-input>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-item>

        <!-- Item Tipo de sangre -->
        <ion-item>
          <ion-select 
            name="tipoSangre"
            [(ngModel)]="formData.tipoSangre"
            label="Tipo de sangre">
            <ion-select-option value="O-">O -</ion-select-option>
            <ion-select-option value="O+">O +</ion-select-option>
            <ion-select-option value="A-">A -</ion-select-option>
            <ion-select-option value="A+">A +</ion-select-option>
            <ion-select-option value="B-">B -</ion-select-option>
            <ion-select-option value="B+">B +</ion-select-option>
            <ion-select-option value="AB-">AB -</ion-select-option>
            <ion-select-option value="AB+">AB +</ion-select-option>
          </ion-select>
        </ion-item>

        <!-- Nuevo Donante -->
        <ion-item>
          <ion-checkbox 
            name="nuevoDonante"
            [(ngModel)]="formData.nuevoDonante"
            labelPlacement="start">
            ¿Es su primera vez donando sangre?
          </ion-checkbox>
        </ion-item>

        <!-- Términos y Condiciones -->
        <ion-item>
          <ion-checkbox 
            name="aceptaTerminos"
            [(ngModel)]="formData.aceptaTerminos"
            labelPlacement="start"
            required>
            Acepto los términos y condiciones
          </ion-checkbox>
        </ion-item>

        <!-- Notificaciones -->
        <ion-item>
          <ion-checkbox 
            name="recibirNotificaciones"
            [(ngModel)]="formData.recibirNotificaciones"
            labelPlacement="start">
            Deseo recibir notificaciones sobre campañas de donación
          </ion-checkbox>
        </ion-item>

        <ion-button type="submit" expand="block">Registrarse</ion-button>
      </ion-list>
    </form>
  </ion-card>
</ion-content>
