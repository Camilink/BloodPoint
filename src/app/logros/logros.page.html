<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mis Logros</ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mis Logros</ion-title>
    </ion-toolbar>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </ion-header>

  <ion-grid class="ion-padding">
    <ion-row class="ion-justify-content-center">
      <ion-col size-md="8" size-sm="12">
        <ion-list>
          <!-- Header con botón volver -->
          <ion-item lines="none">
            <ion-buttons slot="start">
              <ion-back-button defaultHref="/tabs/tab4"></ion-back-button>
            </ion-buttons>
            <ion-label>
              <h1 class="ion-text-center">Mis Logros</h1>
            </ion-label>
          </ion-item>
          <!--  -->
          <ion-item>
            <ion-col>
              <ion-label class="ion-text-center">Total Donados: 1800mL</ion-label>
            </ion-col>
            <ion-col>
              <ion-label class="ion-text-center">Estimacion de vidas salvadas: 9</ion-label>
            </ion-col>
          </ion-item>
          <!-- Lista de donaciones -->
          <ion-list>
            <ion-item>
              <ion-thumbnail slot="start" aria-disabled="true">
                <div class="custom-thumbnail">
                  <i class="fa-solid fa-droplet"></i>
                </div>
              </ion-thumbnail>
              <ion-label>
                <h3>Primera Donacion</h3>
              </ion-label>
              <ion-checkbox slot="end" [checked]="true"></ion-checkbox>
            </ion-item>
  
            <ion-item>
              <ion-thumbnail slot="start">
                <div class="custom-thumbnail">
                  <i class="fa-solid fa-calendar-days"></i>
                </div>
              </ion-thumbnail>
              <ion-label>
                <h3>Constancia</h3>
              </ion-label>
              <ion-checkbox slot="end" [checked]="true"></ion-checkbox>
            </ion-item>
  
            <ion-item>
              <ion-thumbnail slot="start">
                <div class="custom-thumbnail">
                  <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
              </ion-thumbnail>
              <ion-label>
                <h3>Respuestas Urgente</h3>
              </ion-label>
              <ion-checkbox slot="end" [checked]="true"></ion-checkbox>
            </ion-item>
  
            <ion-item>
              <ion-thumbnail slot="start">
                <div class="custom-thumbnail">
                  <i class="fa-solid fa-people-group"></i>
                </div>
              </ion-thumbnail>
              <ion-label>
                <h3>Donacion grupal</h3>
              </ion-label>
              <ion-checkbox slot="end" disabled="true"></ion-checkbox>
            </ion-item>

            <ion-item>
              <ion-thumbnail slot="start">
                <div class="custom-thumbnail">
                  <i class="fa-solid fa-bullhorn"></i>
                </div>
              </ion-thumbnail>
              <ion-label>
                <h3>Promotor bloodpoint</h3>
              </ion-label>
              <ion-checkbox slot="end" disabled="true"></ion-checkbox>
            </ion-item>
          </ion-list>
          <!-- Item Sharing -->
          <ion-row class="ion-justify-content-center ion-margin-top">
            <ion-col size="auto" class="ion-text-center">
              <ion-button (click)="share()">Compartir mis logros</ion-button>
            </ion-col>
          </ion-row>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
