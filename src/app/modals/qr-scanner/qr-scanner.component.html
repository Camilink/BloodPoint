<ion-content>
  <div class="scan-container">
    <h1>Escanea el código QR</h1>
    <div class="scan-box">
      <video id="video-preview"></video>
      <div class="scan-border"></div>
    </div>
    <ion-button 
      class="cancel-button" 
      (click)="dismiss()"
      fill="solid"
      color="light"
      shape="round"
      size="large">
      <ion-icon name="close-outline" slot="start"></ion-icon>
      Cancelar
    </ion-button>
  </div>
</ion-content>
