<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mis Logros</ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ovalo ovalotop"></div>
  <div class="ovalo ovalomid"></div>

  <!-- Header with back button -->
  <div class="header-section">
    <ion-back-button defaultHref="/menu/perfil" text="" icon="arrow-back"></ion-back-button>
    <h1>Mis logros</h1>
  </div>

  <!-- Stats Section -->
  <div class="stats-section">
    <h2>Total donado: 1800mL</h2>
    <h2>Estimacion de vidas salvadas: 9</h2>
  </div>

  <!-- Achievements List -->
  <div class="achievements-list">
    <!-- Achievement Item 1 -->
    <div class="achievement-item">
      <div class="status-circle">
        <i class="fas fa-check"></i>
      </div>
      <div class="achievement-content">
        <i class="fa-solid fa-droplet"></i>
        <span>Primera donacion</span>
      </div>
    </div>

    <!-- Achievement Item 2 -->
    <div class="achievement-item">
      <div class="status-circle">
        <i class="fas fa-check"></i>
      </div>
      <div class="achievement-content">
        <i class="fa-solid fa-calendar-days"></i>
        <span>Constancia</span>
      </div>
    </div>

    <!-- Achievement Item 3 -->
    <div class="achievement-item">
      <div class="status-circle">
        <i class="fas fa-check"></i>
      </div>
      <div class="achievement-content">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Respuesta urgente</span>
      </div>
    </div>

    <!-- Achievement Item 4 -->
    <div class="achievement-item locked">
      <div class="status-circle">
        <i class="fas fa-lock"></i>
      </div>
      <div class="achievement-content">
        <i class="fa-solid fa-people-group"></i>
        <span>Donacion grupal</span>
      </div>
    </div>

    <!-- Achievement Item 5 -->
    <div class="achievement-item locked">
      <div class="status-circle">
        <i class="fas fa-lock"></i>
      </div>
      <div class="achievement-content">
        <i class="fa-solid fa-bullhorn"></i>
        <span>Promotor bloodpoint</span>
      </div>
    </div>
  </div>

  <!-- Share Button -->
  <ion-button expand="block" class="share-button" (click)="share()">
    compartir mis logros
  </ion-button>
</ion-content>
