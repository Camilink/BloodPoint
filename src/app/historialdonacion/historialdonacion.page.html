<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Historial de Donaciones</ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ovalo ovalotop"></div>
  <div class="ovalo ovalomid"></div>

  <!-- Header with back button -->
  <div class="header-section">
    <div class="back-button" [routerLink]="['/menu/perfil']">
      <i class="fas fa-arrow-left"></i>
    </div>
    <h1>Historial de donaciones</h1>
  </div>

  <!-- Donation List -->
  <ion-list>
    <ion-item button [routerLink]="['/menu/detallesh']">
      <div class="donation-icon">
        <i class="fa-solid fa-droplet"></i>
      </div>
      <ion-label>
        <h2>2 de abril de 2025</h2>
        <p>Centro de donación habitual</p>
      </ion-label>
      <i class="fas fa-chevron-right" slot="end"></i>
    </ion-item>

    <ion-item button [routerLink]="['/menu/detallesh']">
      <div class="donation-icon">
        <i class="fa-solid fa-droplet"></i>
      </div>
      <ion-label>
        <h2>18 de enero de 2025</h2>
        <p>Donación Habitual</p>
      </ion-label>
      <i class="fas fa-chevron-right" slot="end"></i>
    </ion-item>

    <ion-item button [routerLink]="['/menu/detallesh']">
      <div class="donation-icon">
        <i class="fa-solid fa-droplet"></i>
      </div>
      <ion-label>
        <h2>6 de marzo 2024</h2>
        <p>Donación de reposición</p>
      </ion-label>
      <i class="fas fa-chevron-right" slot="end"></i>
    </ion-item>

    <ion-item button [routerLink]="['/menu/detallesh']">
      <div class="donation-icon">
        <i class="fa-solid fa-droplet"></i>
      </div>
      <ion-label>
        <h2>3 de noviembre de 2022</h2>
        <p>Donación de reposición</p>
      </ion-label>
      <i class="fas fa-chevron-right" slot="end"></i>
    </ion-item>
  </ion-list>
</ion-content>
