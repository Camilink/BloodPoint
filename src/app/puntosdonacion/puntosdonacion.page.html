<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Donar
    </ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Fixed Header Section -->
  <div class="fixed-header">
    <!-- Buscador -->
    <div class="center-wrapper">
      <ion-searchbar show-clear-button="focus" animated="true" placeholder="Buscar..."></ion-searchbar>
    </div>
    
    <!-- Ubicacion y Horario -->
    <ion-grid [fixed]="true">
      <ion-row>
        <ion-col>
          <ion-item class="select-item">
            <ion-select class="select-popover"
                       [(ngModel)]="selectedLocation" 
                       (ionChange)="filterByLocation()"
                       placeholder="Ubicación" 
                       interface="popover">
              <ion-select-option *ngFor="let address of availableLocations" 
                                [value]="address">
                {{address}}
              </ion-select-option>
            </ion-select>
          </ion-item>
        </ion-col>
        <ion-col>
          <ion-item class="select-item">
            <ion-select [(ngModel)]="selectedSchedule" 
                       (ionChange)="filterBySchedule()"
                       placeholder="Horario" 
                       interface="popover"
                       [disabled]="!selectedLocation">
              <ion-select-option *ngFor="let schedule of uniqueSchedules" 
                                [value]="schedule">
                {{schedule}}
              </ion-select-option>
            </ion-select>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>
    
    <!-- Filter Actions -->
    <div class="filter-actions">
      <div class="open-toggle-wrapper">
        <ion-button fill="clear" 
                    size="small" 
                    (click)="toggleOpenOnly()">
          <ion-icon [name]="showOnlyOpen ? 'time' : 'time-outline'" slot="start"></ion-icon>
          Mostrar solo abiertos
          <ion-toggle [(ngModel)]="showOnlyOpen" 
                     (ionChange)="filterCenters()"
                     (click)="$event.stopPropagation()"
                     slot="end">
          </ion-toggle>
        </ion-button>
      </div>
      
      <div class="reset-button-wrapper">
        <ion-button fill="clear" 
                    size="small" 
                    (click)="resetFilters()"
                    [disabled]="!selectedLocation && !selectedSchedule && !showOnlyOpen">
          <ion-icon name="refresh-outline" slot="start"></ion-icon>
          Limpiar filtros
        </ion-button>
      </div>
    </div>
  </div>

  <!-- Scrollable Content -->
  <div class="scrollable-content">
    <ion-list>
      <ion-item *ngFor="let center of filteredCenters" class="center-item">
        <ion-label>
          <div class="center-header">
            <h2>{{center.name}}</h2>
            <span class="distance">
              <i class="fa-solid fa-location-dot"></i>
              {{center.distance}} km
            </span>
          </div>
          <p class="address">{{center.address}}</p>
          <div class="schedule">
            <i class="fa-solid fa-circle" [style.color]="isOpen(center) ? '#00ff04' : '#ff0000'"></i>
            <i class="fa-solid fa-clock"></i>
            <span>{{center.schedules[0].days}}: {{center.schedules[0].hours}}</span>
          </div>
          <p class="contact">
            <i class="fa-solid fa-phone"></i>
            {{center.contacts[0]}}
          </p>
          <ion-button expand="block" 
                      (click)="showDetails(center.name)"
                      color="danger">
            Ver Detalles
          </ion-button>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
