<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Detalles</ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ovalo ovalotop"></div>
  <div class="ovalo ovalomid"></div>

  <!-- Header with back button -->
  <div class="header-section">
    <ion-back-button defaultHref="/menu/puntosdonacion" text="" icon="arrow-back"></ion-back-button>
    <h1>Centro de Donación A</h1>
  </div>

  <!-- Details Card -->
  <div class="details-card">
    <div class="info-item">
      <i class="fa-solid fa-map-location-dot"></i>
      <div class="info-content">
        <span class="label">Dirección:</span>
        <span class="value">Calle 234, comuna</span>
      </div>
    </div>

    <div class="info-item">
      <i class="fa-regular fa-clock"></i>
      <div class="info-content">
        <span class="label">Horario:</span>
        <span class="value">Lun - Vie, Hoy: 10:00 - 16:00</span>
      </div>
    </div>

    <div class="info-item">
      <i class="fa-solid fa-phone"></i>
      <div class="info-content">
        <span class="label">Teléfono:</span>
        <span class="value">+56 9 0000 0000</span>
      </div>
    </div>

    <div class="info-item">
      <i class="fa-solid fa-location-dot"></i>
      <div class="info-content">
        <span class="label">Distancia:</span>
        <span class="value">0.5 kilómetros</span>
      </div>
    </div>

    <div class="info-item">
      <i class="fa-solid fa-droplet"></i>
      <div class="info-content">
        <span class="label">Tipo de sangre con prioridad:</span>
        <span class="value">O-, AB-</span>
      </div>
    </div>
  </div>
</ion-content>
