<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Detalles</ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ovalo ovalotop"></div>
  <div class="ovalo ovalomid"></div>

  <!-- Header with back button -->
  <div class="header-section">
    <ion-back-button 
      defaultHref="/menu/puntosdonacion"
      (click)="goBack()"
      text="" 
      icon="arrow-back">
    </ion-back-button>
    <h1>{{center?.name}}</h1>
  </div>

  <!-- Details Card -->
  <div class="details-card" *ngIf="center">
    <div class="info-item">
      <i class="fa-solid fa-map-location-dot"></i>
      <div class="info-content">
        <span class="label">Dirección:</span>
        <span class="value">{{center?.address || 'No disponible'}}</span>
      </div>
    </div>

    <div class="info-item">
      <i class="fa-regular fa-clock"></i>
      <div class="info-content">
        <span class="label">Horario:</span>
        <div class="value" *ngFor="let schedule of center?.schedules">
          {{schedule?.days}}: {{schedule?.hours}}
        </div>
      </div>
    </div>

    <div class="info-item">
      <i class="fa-solid fa-phone"></i>
      <div class="info-content">
        <span class="label">Teléfono:</span>
        <span class="value" *ngFor="let contact of center?.contacts">{{contact}}</span>
      </div>
    </div>

    <div class="info-item">
      <i class="fa-solid fa-location-dot"></i>
      <div class="info-content">
        <span class="label">Distancia:</span>
        <span class="value">{{center.distance || '0'}} kilómetros</span>
      </div>
    </div>
  </div>
</ion-content>
