<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Detalles</ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Detalles</ion-title>
    </ion-toolbar>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </ion-header>

  <!-- Item Detalles -->
   <ion-grid [fixed]="true">
    <ion-list>
        <ion-item>
          <ion-buttons slot="start">
            <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
          </ion-buttons>
          <h1>Centro de atencion A</h1>
        </ion-item>
        <ion-card-content>
          <ion-item>
            <ion-thumbnail slot="start">
              <br>
              <i class="fa-solid fa-map fa-2xl"></i>
            </ion-thumbnail>
            <ion-label>Copiapo 123</ion-label>
          </ion-item>
          <ion-item>
            <ion-thumbnail slot="start">
              <br>
              <i class="fa-solid fa-clock fa-2xl"></i>
            </ion-thumbnail>
            <ion-label>Hoy: 10:00 - 12:00</ion-label>
          </ion-item>
          <ion-item>
            <ion-thumbnail slot="start">
              <br>
              <i class="fa-solid fa-phone fa-2xl"></i>
            </ion-thumbnail>
            <ion-label>+569 4312 2314</ion-label>
          </ion-item>
          <ion-item>
            <ion-thumbnail slot="start">
              <br>
              <i class="fa-solid fa-location-dot fa-2xl"></i>
            </ion-thumbnail>
            <ion-label>Distancia: 0.5 Kilometros</ion-label>
          </ion-item>
          <ion-item>
            <ion-thumbnail slot="start">
              <br>
              <i class="fa-solid fa-droplet fa-2xl"></i>
            </ion-thumbnail>
            <ion-label>Tipo de sangre con prioridad: A -, O -</ion-label>
          </ion-item>
        </ion-card-content>
        <div class="ion-text-center">
          <ion-button>Confirmar Donación</ion-button>
        </div>
    </ion-list>
  </ion-grid>
