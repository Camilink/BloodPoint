<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Historial de Donaciones</ion-title>
  </ion-toolbar>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ovalo ovalotop"></div>
  <div class="ovalo ovalomid"></div>

  <!-- Header with back button -->
  <div class="header-section">
    <div class="back-button" [routerLink]="['/menu/perfil']">
      <i class="fas fa-arrow-left"></i>
    </div>
    <h1>Historial de donaciones</h1>
  </div>

  <!-- Donation List --><ion-list *ngIf="donaciones.length > 0; else sinDonaciones">
  <ion-item *ngFor="let don of donaciones" button [routerLink]="['/menu/detallesh']">
    <div class="donation-icon">
      <i class="fa-solid fa-droplet"></i>
    </div>
    <ion-label>
      <h2>{{ don.fecha_donacion | date: 'longDate' }}</h2>
      <p>{{ don.centro }}</p>
    </ion-label>
    <i class="fas fa-chevron-right" slot="end"></i>
  </ion-item>
</ion-list>

<ng-template #sinDonaciones>
  <ion-text color="medium">
    <p class="ion-padding">No hay donaciones registradas.</p>
  </ion-text>
</ng-template>

</ion-content>
